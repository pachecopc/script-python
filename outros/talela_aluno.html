<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Resultado dos Alunos</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        max-width: 600px;
        margin: auto;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 8px;
        margin: 5px 0 15px 0;
        border: 1px solid #aaa;
        border-radius: 4px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #333;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #555;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 25px;
        background: white;
    }

    th, td {
        border: 1px solid #444;
        padding: 10px;
        text-align: center;
    }

    th {
        background: #333;
        color: white;
    }

    .aprovado { color: green; font-weight: bold; }
    .recuperacao { color: orange; font-weight: bold; }
    .reprovado { color: red; font-weight: bold; }

    .mensagem {
        background: white;
        padding: 10px;
        border-left: 4px solid #333;
        margin-top: 10px;
    }

    .reprovado-row{
        background: #f7c5c5;
        animation: fadeIn 0.5s ease;
    }

    .recuperacao-row{
        background: yellow;
        animation: fadeIn 0.5s ease;}

    .aprovado-row{
        background: #c2ffb3;
        animation: fadeIn 0.5s ease;}    

    @keyframes fadeIn {  
        from {
            opacity: 0;
            tranform:translatey(-8px)
        }
        to {
            opacity: 1;
            transform: translatey(0)
      }
    }
</style>
</head>
<body>

<h1>Sistema de Notas dos Alunos de 2026</h1>

<div class="container">
    <label>Nome do aluno:</label>
    <input type="text" id="nome">

    <label>Nota 1:</label>
    <input type="number" id="nota1" step="0.01">

    <label>Nota 2:</label>
    <input type="number" id="nota2" step="0.01">

    <label>Nota 3:</label>
    <input type="number" id="nota3" step="0.01">

    <button onclick="adicionarAluno()">Adicionar Aluno</button>
</div>

<div id="resultado"></div>
<script>
    let alunos = [];

    // Carrega alunos salvos no navegador
    window.onload = function () {
        const dados = localStorage.getItem("alunos");
        if (dados) {
            alunos = JSON.parse(dados);
            mostrarTabela();
        }
    };

    function salvarLocal() {
        localStorage.setItem("alunos", JSON.stringify(alunos));
    }

    function adicionarAluno() {
        let nome = document.getElementById("nome").value;

        // Primeira letra maiúscula
        nome = nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase();

        let n1 = parseFloat(document.getElementById("nota1").value);
        let n2 = parseFloat(document.getElementById("nota2").value);
        let n3 = parseFloat(document.getElementById("nota3").value);

        if (!nome || isNaN(n1) || isNaN(n2) || isNaN(n3)) {
            alert("Preencha todos os campos corretamente!");
            return;
        }

        let media = (n1 + n2 + n3) / 3;
        let status = "";
        let mensagem = "";

        if (media >= 7) {
            status = "Aprovado";
            mensagem = "Parabéns! Você foi aprovado. Continue assim!";
        } else if (media >= 5) {
            status = "Recuperação";
            mensagem = "Você está em recuperação. Ainda dá tempo de melhorar!";
        } else {
            status = "Reprovado";
            mensagem = "Infelizmente você foi reprovado. Não desanime, tente novamente.";
        }

        alunos.push({ nome, media, status, mensagem });
        salvarLocal();
        mostrarTabela();

        document.getElementById("nome").value = "";
        document.getElementById("nota1").value = "";
        document.getElementById("nota2").value = "";
        document.getElementById("nota3").value = "";
    }

    function excluirAluno(index) {
        alunos.splice(index, 1);
        salvarLocal();
        mostrarTabela();
    }

    function mostrarTabela() {
        let html = `
        <table>
            <tr>
                <th>Nome</th>
                <th>Média</th>
                <th>Status</th>
                <th>Mensagem</th>
                <th>Ação</th>
            </tr>
        `;

        alunos.forEach((a, index) => {
            let classe = "";

            if (a.status === "Aprovado") classe = "aprovado-row";
            else if (a.status === "Recuperação") classe = "recuperacao-row";
            else classe = "reprovado-row";

            html += `
            <tr class="${classe}">
                <td>${a.nome}</td>
                <td>${a.media.toFixed(2)}</td>
                <td>${a.status}</td>
                <td>${a.mensagem}</td>
                <td>
                    <button onclick="excluirAluno(${index})" style="
                        background:#c0392b;
                        color:white;
                        border:none;
                        padding:6px 10px;
                        border-radius:4px;
                        cursor:pointer;
                    ">Excluir</button>
                </td>
            </tr>
            `;
        });

        html += "</table>";

        document.getElementById("resultado").innerHTML = html;
    }
</script>




</body>
</html>
